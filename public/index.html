<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesocycle</title>
  <meta name="description" content="A planning agent that re-plans your day when life breaks the plan.">
  <meta name="theme-color" content="#2457d6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <style>
    :root {
      --bg: #f5f6f8; --fg: #15181d; --muted: #5d6573; --card: #fff; --line: #e3e6eb;
      --accent: #2457d6; --accent-fg: #fff; --ok: #1a7f4b; --warn: #a15c00; --bad: #b42318; --chip: #eef1f6; --tip: #f0f5ff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1115; --fg: #e8eaee; --muted: #9aa3b2; --card: #181b21; --line: #2a2f38;
        --accent: #6f95ff; --accent-fg: #0f1115; --ok: #4cc38a; --warn: #e3a24a; --bad: #f97066; --chip: #232832; --tip: #1a2233;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 22px; }
    h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .muted { color: var(--muted); }
    .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .intro { background: var(--tip); }
    .intro ul { margin: 6px 0 12px; padding-left: 18px; }
    .now-title { font-size: 22px; font-weight: 650; margin: 2px 0 4px; }
    .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-size: 15px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    button.small { font-size: 13px; padding: 5px 10px; }
    button:disabled { opacity: .5; cursor: default; }
    .next { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
    .next:first-of-type { border-top: 0; }
    textarea { width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); resize: vertical; min-height: 64px; }
    .reply { white-space: pre-wrap; margin: 12px 0 0; }
    .option { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 10px; }
    .option ul { margin: 6px 0 8px; padding-left: 18px; }
    .steps { font: 13px/1.6 ui-monospace, Consolas, monospace; margin: 8px 0 0; padding-left: 18px; }
    .ok { color: var(--ok); } .no { color: var(--bad); }
    .bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; margin-top: 3px; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .bar.under i { background: var(--warn); }
    .floor { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14px; margin-bottom: 8px; }
    .warn { color: var(--warn); }
    .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 6px; margin-top: 10px; }
    .day { border: 1px solid var(--line); border-radius: 8px; padding: 6px; font-size: 12px; min-height: 60px; }
    .day b { display: block; font-size: 12px; margin-bottom: 4px; }
    .day .it { margin: 2px 0; line-height: 1.3; }
    .day .debt { color: var(--warn); }
    .caption { border-left: 3px solid var(--accent); padding: 6px 10px; margin: 10px 0 0; background: var(--tip); border-radius: 0 8px 8px 0; font-size: 14px; }
    details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
    .tl { position: relative; margin-left: 44px; border-left: 1px solid var(--line); }
    .tl .hr { position: absolute; left: -44px; width: 38px; text-align: right; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
    .tl .blk { position: absolute; left: 8px; right: 0; border-radius: 8px; padding: 3px 8px; font-size: 12px; line-height: 1.3; overflow: hidden;
      background: var(--tip); border: 1px solid var(--accent); color: var(--fg); transition: top .6s ease, height .6s ease, opacity .4s; }
    .tl .blk.fixed { background: repeating-linear-gradient(45deg, var(--chip), var(--chip) 6px, var(--card) 6px, var(--card) 12px); border-color: var(--line); color: var(--muted); }
    .tl .blk.gone { opacity: 0; }
    .tl .nowline { position: absolute; left: -4px; right: 0; border-top: 2px solid var(--bad); transition: top .6s ease; }
    .tl .sleep { position: absolute; left: 8px; right: 0; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--muted); padding-top: 2px; }
    @media (prefers-reduced-motion: reduce) { .tl .blk, .tl .nowline { transition: none; } }
    input[type=time], select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    :root {
      --r0: #2457d6; --r1: #0f8a6a; --r2: #c2410c; --r3: #8b3fd1; --r4: #c0266d; --r5: #8a6d00; --r6: #0b7cae; --r7: #77791a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --r0: #5f87ee; --r1: #25a886; --r2: #d96f1c; --r3: #9670ea; --r4: #e05289; --r5: #ad8f22; --r6: #2299cf; --r7: #8a9629;
      }
    }
    body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-feature-settings: 'cv11', 'ss03'; -webkit-font-smoothing: antialiased; }
    main { max-width: 640px; padding: 12px 16px calc(96px + env(safe-area-inset-bottom)); }
    .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; max-width: 640px; margin: 0 auto; padding: 10px 16px; background: var(--bg); }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
    .top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    #tabs { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    #tabs button { border: 0; border-radius: 0; background: none; color: var(--muted); padding: 10px 4px 12px; font-size: 13px; font-weight: 500; border-top: 2px solid transparent; }
    #tabs button.on { color: var(--accent); border-top-color: var(--accent); font-weight: 650; }
    #tabs b { display: block; font-size: 18px; line-height: 1.2; font-weight: 400; }
    @media (min-width: 760px) {
      #tabs { position: static; display: flex; gap: 4px; background: none; border: 0; padding: 0; }
      #tabs button { padding: 6px 12px; border-radius: 8px; border: 0; font-size: 14px; }
      #tabs button.on { background: var(--chip); }
      #tabs b { display: none; }
      main { padding-bottom: 48px; }
    }
    h2 { letter-spacing: .04em; font-weight: 600; }
    .card { border-radius: 16px; }
    .now { background: color-mix(in srgb, var(--rc, var(--accent)) 9%, var(--card)); border-color: color-mix(in srgb, var(--rc, var(--accent)) 35%, var(--line)); border-left: 6px solid var(--rc, var(--accent)); padding: 18px; }
    .now-title { font-size: 27px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin: 4px 0 6px; }
    .chip.role { color: var(--fg); background: color-mix(in srgb, var(--rc) 16%, var(--card)); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rc); margin-right: 6px; flex: none; }
    .tl .blk { background: color-mix(in srgb, var(--rc, var(--accent)) 13%, var(--card)); border: 0; border-left: 3px solid var(--rc, var(--accent)); }
    .bar { position: relative; display: flex; }
    .bar i, .bar.under i { background: var(--rc, var(--accent)); }
    .bar i.plan { opacity: .4; }
    .bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); opacity: .55; }
    .warnbar { border-left-color: var(--warn); }
    .diff { list-style: none; margin: 8px 0 0; padding: 0; font-size: 14px; }
    .diff li { padding: 2px 0; }
    .day .it { border-left: 2px solid var(--rc, var(--line)); padding-left: 5px; }
    .day .debt { font-weight: 500; }
    .goal { padding: 12px 0; border-top: 1px solid var(--line); }
    .goal:first-of-type { border-top: 0; padding-top: 0; }
    .goal-title { font-weight: 650; font-size: 17px; letter-spacing: -.01em; }
    .rv { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    .rv th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 4px 6px 4px 0; }
    .rv th::first-letter { text-transform: uppercase; }
    .rv td { padding: 6px 6px 6px 0; border-top: 1px solid var(--line); }
    .rv .n { text-align: right; white-space: nowrap; }
    .edit-row { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
    .edit-row:first-of-type { border-top: 0; }
    .edit-row .line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .edit-row label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
    input[type=text], input[type=number], input[type=date] { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; }
    input[type=text] { flex: 1 1 140px; }
    input[type=number] { width: 68px; }
    .dayp { position: relative; }
    .dayp input { position: absolute; opacity: 0; }
    .dayp span { display: inline-block; min-width: 30px; text-align: center; padding: 3px 5px; border-radius: 6px; font-size: 12px; background: var(--chip); color: var(--muted); cursor: pointer; }
    .dayp input:checked + span { background: var(--accent); color: var(--accent-fg); }
    .dayp input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
    .icon { padding: 3px 9px; font-size: 14px; color: var(--muted); }
    #edit-bar { position: sticky; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 4; margin-top: 8px; box-shadow: 0 4px 18px rgba(0, 0, 0, .14); }
    @media (min-width: 760px) { #edit-bar { bottom: 12px; } }
    .consent { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); margin-top: 8px; }
    .consent[hidden] { display: none; }
    .consent input { margin-top: 3px; flex: none; }
    #call-box { position: fixed; z-index: 7; left: 12px; right: 12px; bottom: calc(72px + env(safe-area-inset-bottom)); max-width: 616px; margin: 0 auto; max-height: 45vh; overflow-y: auto; box-shadow: 0 8px 28px rgba(0, 0, 0, .22); border: 2px solid var(--accent); }
    #call-box[hidden] { display: none; }
    #call-phase { font-size: 15px; }
    #call-live:empty, #call-note:empty, #call-reply:empty { display: none; }
    @media (min-width: 760px) { #call-box { bottom: 16px; } }
    .trend { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-top: 8px; }
    .trend .name { font-size: 14px; display: flex; align-items: center; }
    .trend .val { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tbars { position: relative; height: 56px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 6px; }
    .tb { flex: 1; max-width: 22px; min-height: 2px; background: var(--rc); border-radius: 4px 4px 0 0; }
    .tb.cur { opacity: .5; }
    .tgt { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); }
    #promises summary { color: var(--ok); font-weight: 500; }
    #promises.bad summary { color: var(--bad); }
    #promises li { list-style: none; margin-left: -20px; padding: 2px 0; }
    .option.deadline { border-left: 3px solid var(--r0); }
    .option.life { border-left: 3px solid var(--r1); }
    .option.both { border-left: 3px solid var(--ok); }
    .option ul { margin-top: 2px; }
    .invite { text-align: center; padding: 28px 16px; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  </style>
</head>
<body>
  <header class="top">
    <p class="brand">Mesocycle</p>
    <nav id="tabs" role="tablist">
      <button role="tab" data-tab="today"><b>◉</b><span data-t="today"></span></button>
      <button role="tab" data-tab="week"><b>▦</b><span data-t="weekTab"></span></button>
      <button role="tab" data-tab="goals"><b>◎</b><span data-t="goalsTab"></span></button>
    </nav>
    <div class="right">
      <span class="chip" id="save-note" data-t="unsaved" hidden></span>
      <span class="muted" id="date" style="font-size:13px"></span>
      <a id="guide" href="/huong-dan" style="font-size:13px;color:var(--accent)">?</a>
      <button class="small" id="lang" title="Tiếng Việt / English"></button>
    </div>
  </header>
  <main>
    <div id="p-today">
    <section class="card caption" id="offline-bar" hidden data-t="offlineNote" style="margin:0 0 14px"></section>
    <section class="card caption" id="sample-bar" hidden style="margin:0 0 14px"></section>
    <section class="card caption" id="week-banner" hidden style="margin:0 0 14px"></section>
    <section class="card intro" id="intro"></section>
    <section class="card" id="setup" hidden>
      <h2 data-t="setupTitle"></h2>
      <p class="hint" data-t="setupHint" style="margin-top:0"></p>
      <textarea id="setup-text" style="min-height:120px"></textarea>
      <label class="consent" data-consent><input type="checkbox" id="setup-consent"> <span><span data-t="consentText"></span> <a href="/privacy" target="_blank" rel="noopener" data-t="consentLink"></a><span data-t="consentTail"></span></span></label>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="setup-go" data-t="build"></button>
        <button id="setup-mic"></button>
        <button id="setup-photo" data-t="photo"></button>
        <span class="chip" id="setup-photo-chip" hidden></span>
        <button class="small" id="setup-cancel" data-t="cancel"></button>
      </div>
      <div class="hint" id="setup-status"></div>
    </section>
    <section class="card caption" id="checkin" hidden style="margin:0 0 14px"></section>
    <section class="card caption warnbar" id="risk-bar" hidden style="margin:0 0 14px"></section>
    <section class="card now" id="now-card"></section>
    <section class="card" id="next-card"></section>
    <details class="card" id="tl-card" open>
      <summary data-t="timeline"></summary>
      <div class="tl" id="tl" style="margin-top:12px"></div>
    </details>

    <details class="card" id="promises"><summary id="promises-sum"></summary><ul id="promises-list" style="margin:10px 0 0;padding-left:20px;font-size:14px"></ul></details>

    <section class="card">
      <h2 data-t="changed"></h2>
      <textarea id="say"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="send" data-t="replan"></button>
        <button id="call" data-t="callBtn"></button>
        <button id="mic"></button>
        <button id="photo" data-t="photo"></button>
        <input type="file" id="photo-file" accept="image/*" hidden>
        <label class="row" style="font-size:14px;gap:6px"><input type="checkbox" id="private"> <span data-t="privateOn"></span></label>
      </div>
      <p class="hint" data-t="changedHint"></p>
      <p class="hint" id="private-hint" data-t="privateHint" hidden></p>
      <div id="status" class="hint"></div>
      <ol class="steps" id="live-steps"></ol>
      <div id="answer"></div>
    </section>

    <details class="card">
      <summary data-t="feedback"></summary>
      <p class="hint" data-t="feedbackHint"></p>
      <textarea id="fb-text" style="margin-top:8px"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="fb-send" data-t="send"></button>
        <span class="hint" id="fb-status"></span>
      </div>
    </details>

    <div class="row" id="real-row" hidden style="margin-bottom:14px">
      <button class="small" id="rebuild" data-t="rebuild"></button>
      <button class="small" id="to-demo" data-t="toDemo"></button>
      <button class="small" id="remind" hidden></button>
      <span class="hint" id="remind-status" style="margin:0"></span>
    </div>

    <details class="card" id="demo-box">
      <summary data-t="demoControls"></summary>
      <div class="row" style="margin-top:10px">
        <label><span data-t="clock"></span> <input type="time" id="clock" step="300"></label>
        <button id="reset" data-t="reset"></button>
      </div>
      <p class="hint" data-t="clockHint"></p>
    </details>

    <section class="card" id="account" style="padding:10px 16px">
      <div class="row" style="justify-content:space-between">
        <span class="hint" id="account-text" style="margin:0"></span>
        <label class="consent" data-consent><input type="checkbox" id="login-consent"> <span><span data-t="consentText"></span> <a href="/privacy" target="_blank" rel="noopener" data-t="consentLink"></a><span data-t="consentTail"></span></span></label>
        <div class="row"><div id="gsi"></div><button class="small" id="logout" hidden></button><button class="small" id="delete-data" data-t="deleteData" hidden></button></div>
      </div>
    </section>
    </div>

    <div id="p-week" hidden>
      <section class="card" id="review-card" hidden></section>
      <section class="card" id="trend-card" hidden></section>
      <section class="card"><div id="week-card"></div><div id="week-forecast"></div></section>
      <section class="card" id="week-invite" hidden></section>
      <div id="edit-week" hidden>
        <details class="card"><summary data-t="editRoles"></summary><div id="ed-roles"></div><button class="small" data-add="roles" data-t="addRole" style="margin-top:8px"></button></details>
        <details class="card"><summary data-t="editFixed"></summary><div id="ed-fixed"></div><button class="small" data-add="fixed" data-t="addFixed" style="margin-top:8px"></button></details>
        <details class="card"><summary data-t="editTasks"></summary><div id="ed-tasks"></div><button class="small" data-add="tasks" data-t="addTask" style="margin-top:8px"></button></details>
        <details class="card"><summary data-t="editTimes"></summary><div class="row" id="ed-times" style="margin-top:10px"></div><p class="hint" data-t="sleepNote"></p></details>
      </div>
    </div>

    <div id="p-goals" hidden>
      <section class="card" id="goals-card"></section>
      <div id="edit-goals" hidden>
        <details class="card"><summary data-t="editGoals"></summary><div id="ed-goals"></div><button class="small" data-add="goals" data-t="addGoal" style="margin-top:8px"></button></details>
      </div>
    </div>

    <p class="hint" style="text-align:center"><a href="/privacy" data-t="privacyLink" style="color:var(--accent)"></a></p>

    <section class="card" id="call-box" hidden aria-live="polite">
      <div class="row" style="justify-content:space-between">
        <b id="call-phase"></b>
        <button id="call-end" data-t="callEnd"></button>
      </div>
      <p class="hint" id="call-live"></p>
      <p id="call-reply" style="margin:6px 0 0"></p>
      <p class="hint" id="call-note"></p>
    </section>

    <section class="card" id="edit-bar" hidden>
      <div class="row">
        <button class="primary" id="edit-save" data-t="saveEdits"></button>
        <button id="edit-cancel" data-t="cancel"></button>
        <span class="hint" id="edit-status" style="margin:0"></span>
      </div>
    </section>
  </main>

  <script type="module">
    import { handlers } from '/core/handlers.js';
    import { replan, applyEvent } from '/core/planner.js';
    import { checkPlan } from '/core/invariants.js';
    import { deadlineRadar } from '/core/radar.js';
    import { planDiff, isEmptyDiff } from '/core/diff.js';

    const T = {
      en: {
        intro: `<h2>What is this?</h2>
          <p style="margin:0">A planner that re-plans your day when life breaks the plan. This demo is the author's real Friday before midterms.</p>
          <ul>
            <li><b>Now</b> shows one thing to do. Tap Done, Need more time, or Can't do it, and the rest of the day slides.</li>
            <li>When something changes, <b>say it or type it</b>. The AI agent re-plans and asks before cutting anything.</li>
            <li>Sleep and your weekly minimum for family, training and work are protected.</li>
          </ul>`,
        tryDemo: '▶ Try the demo: a broken afternoon', hideIntro: 'Hide', setupBtn: '✨ Set up my week',
        setupTitle: 'Set up my week', build: 'Build my week', cancel: 'Cancel', rebuild: 'Rebuild my week', toDemo: 'Back to the demo day',
        setupHint: 'Describe your week in your own words, or say it. Add a photo of your timetable if you have one. Mesocycle builds your roles, weekly minimums, fixed classes and work blocks.',
        setupPlaceholder: 'e.g. First-year student. Study 20 hours a week (never under 12), my part-time job 8 hours, gym 3 times, call home twice. Biology Mon 8:00 to 11:00, Chemistry Thu 13:00 to 16:00. Finals on Dec 20. Up at 7, sleep at 11:30.',
        building: 'Muse Spark is building your week...', photoAdded: 'photo added', today: 'Today',

name = "mesocycle"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Public by design: Google shows this id to every browser.
[vars]
GOOGLE_CLIENT_ID = "1075267755415-ocr5864jp2bmkmfjojlbtl3im52dqqam.apps.googleusercontent.com"
VAPID_PUBLIC = "BF4soh814486-QrhzneCwnNU5e_PU4kDtnCPinuHdjfHBxoT1kmvi0m_usbwdKhdGbUWZJRBv6yqtpVmxt3NzNA"

# Sends reminders (src/push.js)
[triggers]
crons = ["*/5 * * * *"]

# The web app (HTML/CSS/JS) is served from public/
[assets]
directory = "public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Feedback from people trying the app (list with --prefix 2026- so sessions are not printed: npx wrangler kv key list --binding FEEDBACK --remote --prefix 2026-)
[[kv_namespaces]]
binding = "FEEDBACK"
id = "314d552393544b1faffe8fd90abedaa4"

# Per-visitor limit on AI calls (agent, setup, voice), so one visitor cannot drain the credits.
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

# A loose limit per network, so a made-up visitor id does not buy much.
[[ratelimits]]
name = "AI_IP_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 120
  period = 60

# Run in the US. Meta's API lists no models for requests leaving Hong Kong,
# which is where Cloudflare sends traffic from Vietnam (model_not_found).
[placement]
region = "aws:us-east-1"

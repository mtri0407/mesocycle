name = "mesocycle"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# The web app (HTML/CSS/JS) is served from public/
[assets]
directory = "public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Feedback from people trying the app (read with: npx wrangler kv key list --binding FEEDBACK --remote)
[[kv_namespaces]]
binding = "FEEDBACK"
id = "314d552393544b1faffe8fd90abedaa4"

# Per-visitor limit on AI calls (agent, setup, voice), so one visitor cannot drain the credits.
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 12
  period = 60
